[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hernan", email = "hernanrrromero@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyside6>=6.12.0",
    "python-dotenv>=1.2.4",
    "zxcvbn>=4.5.0",
]

[project.scripts]
password-manager = "password_manager:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
